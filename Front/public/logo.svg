<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer rounded white square -->
  <rect x="2" y="2" width="116" height="116" rx="24" ry="24" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Inner rounded square in bottom-right, divided diagonally -->
  <defs>
    <clipPath id="inner-square">
      <rect x="48" y="48" width="60" height="60" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#inner-square)">
    <!-- Upper triangle (website blue) -->
    <polygon points="48,48 108,48 48,108" fill="#2d5a8c"/>
    <!-- Lower triangle (black) -->
    <polygon points="108,48 108,108 48,108" fill="#000000"/>
  </g>
</svg>
